name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            TAG=alpha
          fi

          # Use explicit paths: `pnpm --filter ... publish` silently skips core.
          pnpm publish packages/core --access public --no-git-checks --tag "$TAG"
          pnpm publish packages/cli --access public --no-git-checks --tag "$TAG"

          npm view "@canaryprobe/core@${TAG}" version
          npm view "@canaryprobe/cli@${TAG}" version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
